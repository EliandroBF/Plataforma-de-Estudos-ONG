<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Do Estudo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2 class="titulo-dois">Login</h2>
        <form id="login-form">
            <input type="email" id="email-input" placeholder="Seu e-mail" required />
            <input type="password" id="senha" placeholder="Sua Senha" required /> 
            <button type="submit" id="entrar-login" class="entrar-login">Entrar</button>
        </form>

        <p id="mensagem" class="mensagem" style="color: red;"></p>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
